name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check shell script syntax and entrypoint on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n install.sh template/claude/router/*.sh
          bash ./install.sh --probe-apps | python3 -B -X utf8 -c 'import json, sys; p = json.load(sys.stdin); assert all(k in p for k in ("antigravity", "codex", "claude", "dsh", "cc_switch")), p'

      - name: Check PowerShell entrypoint on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $probeJson = & pwsh -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --probe-apps
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 --probe-apps exited with $LASTEXITCODE" }
          $parsed = $probeJson | ConvertFrom-Json
          foreach ($key in @('antigravity', 'codex', 'claude', 'dsh', 'cc_switch')) {
            if ($null -eq $parsed.$key) { throw "Missing key $key in install.ps1 --probe-apps output" }
          }

      - name: Run sandbox installations and full offline regression suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -X utf8 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          repo = pathlib.Path.cwd()
          py = [sys.executable, "-B", "-X", "utf8"]

          def emit_ci_error(message: str) -> None:
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{escaped}", flush=True)

          probe = subprocess.run([*py, "install.py", "--probe-apps"], cwd=repo, check=True, capture_output=True, text=True, encoding="utf-8", errors="replace")
          payload = json.loads(probe.stdout)
          assert all(name in payload for name in ("antigravity", "codex", "claude", "dsh", "cc_switch")), payload

          grounding = subprocess.run(
              [*py, "template/user-guard/skills/cae-harness/scripts/cae_harness.py", "check-grounding", "--target", ".", "--strict"],
              cwd=repo, capture_output=True, text=True, encoding="utf-8", errors="replace",
          )
          if grounding.returncode != 0:
              tail = " | ".join(
                  line.strip() for line in (grounding.stdout + "\n" + grounding.stderr).splitlines() if line.strip()
              )[-800:]
              emit_ci_error(f"Grounding check failed (exit {grounding.returncode}): {tail}")
              raise SystemExit(grounding.returncode)
          grounding_report = json.loads(grounding.stdout)
          assert grounding_report.get("ok") is True and grounding_report.get("finding_count") == 0, grounding_report

          with tempfile.TemporaryDirectory(prefix="user-guard-ci-") as tmp:
              base = pathlib.Path(tmp).resolve()
              commands = [
                  [*py, "install.py", "--app", "codex", "--codex-home", str(base / "codex_only"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "antigravity", "--target-dir", str(base / "agy_only" / "plugins" / "user-guard"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "claude", "--claude-home", str(base / "claude_only"), "--with-cc-router", "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "dsh", "--dsh-home", str(base / "dsh_only"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "both", "--target-dir", str(base / "both_agy" / "plugins" / "user-guard"), "--codex-home", str(base / "both_codex"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "all", "--target-dir", str(base / "all_agy" / "plugins" / "user-guard"), "--codex-home", str(base / "all_codex"), "--claude-home", str(base / "all_claude"), "--dsh-home", str(base / "all_dsh"), "--with-cc-router", "--no-zotero"],
              ]
              for cmd in commands:
                  proc = subprocess.run(cmd, cwd=repo, capture_output=True, text=True, encoding="utf-8", errors="replace")
                  if proc.stdout:
                      sys.stdout.write(proc.stdout)
                  if proc.stderr:
                      sys.stderr.write(proc.stderr)
                  if proc.returncode != 0:
                      tail = " | ".join(
                          line.strip() for line in (proc.stdout + "\n" + proc.stderr).splitlines() if line.strip()
                      )[-800:]
                      emit_ci_error(f"CI command failed (exit {proc.returncode}): {tail}")
                      raise SystemExit(proc.returncode)
              def snapshot():
                  return {path.relative_to(base).as_posix():
                          (path.read_bytes() if path.is_file() else None, path.stat().st_mtime_ns)
                          for path in base.rglob("*")}

              before_audit = snapshot()
              clean_env = {k: v for k, v in __import__("os").environ.items() if k != "PYTHONDONTWRITEBYTECODE"}
              audit = subprocess.run(
                  [sys.executable, "-X", "utf8", "install.py", "--audit-upgrade", "--target-dir", str(base / "all_agy" / "plugins" / "user-guard"),
                   "--codex-home", str(base / "all_codex"), "--claude-home", str(base / "all_claude"),
                   "--dsh-home", str(base / "all_dsh"), "--with-cc-router"],
                  cwd=repo, env=clean_env, check=True, capture_output=True, text=True, encoding="utf-8", errors="replace",
              )
              report = json.loads(audit.stdout)
              assert snapshot() == before_audit, "Upgrade audit changed sandbox files or directories"
              pycache_leaks = [str(p.relative_to(repo)) for p in (repo / "template").rglob("__pycache__")]
              assert not pycache_leaks, f"Upgrade audit without -B wrote __pycache__: {pycache_leaks}"
              assert (report.get("errors") == [] if "errors" in report else True) and not report.get("read_errors"), report
              assert set(report["summary"]["recommended_actions"]) <= {"refresh_codex_model_catalog"}, report["summary"]
              for name in ("antigravity", "codex", "claude", "dsh"):
                  assert report[name]["drift_files"] == [], report[name]
              assert report["claude"]["router"]["drift_files"] == [], report["claude"]["router"]
              assert report["claude"]["router"]["config_exists"] is True, report["claude"]["router"]

          unittest_proc = subprocess.run(
              [*py, "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"],
              cwd=repo, capture_output=True, text=True, encoding="utf-8", errors="replace",
          )
          if unittest_proc.stdout:
              sys.stdout.write(unittest_proc.stdout)
          if unittest_proc.stderr:
              sys.stderr.write(unittest_proc.stderr)
          if unittest_proc.returncode != 0:
              tail = " | ".join(
                  line.strip() for line in (unittest_proc.stdout + "\n" + unittest_proc.stderr).splitlines() if line.strip()
              )[-800:]
              emit_ci_error(f"Offline unittest suite failed (exit {unittest_proc.returncode}): {tail}")
              raise SystemExit(unittest_proc.returncode)

          git_status = subprocess.run(
              ["git", "status", "--porcelain"],
              cwd=repo, check=True, capture_output=True, text=True, encoding="utf-8", errors="replace",
          )
          if git_status.stdout.strip():
              emit_ci_error(f"Repository not clean after CI run: {git_status.stdout.strip()}")
              raise AssertionError(f"Expected empty git status --porcelain, got:\n{git_status.stdout}")
          PY
