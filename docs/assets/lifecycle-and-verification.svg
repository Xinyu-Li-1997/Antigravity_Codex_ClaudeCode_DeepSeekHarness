<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title desc">
  <title id="title">会话确认、压缩接力与完成核验</title>
  <desc id="desc">左侧为正常执行链，右侧为中断接力；恢复内容来自磁盘票据，批准必须由用户明确给出。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
  <style>text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23354d; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 17px; fill: #52657b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 16px; } .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }</style>
  <rect width="1440" height="1090" fill="#f3f6fb"/>
  <text x="32" y="49" class="title">会话确认、压缩接力与完成核验</text>
  <text x="32" y="80" class="subtitle">左侧为正常执行链，右侧为中断接力；恢复内容来自磁盘票据，批准必须由用户明确给出。</text>
  <path class="link" d="M 457 280 L 457 310"/>
  <path class="link" d="M 457 440 L 457 470"/>
  <path class="link" d="M 457 622 L 457 652"/>
  <path class="link" d="M 457 802 L 457 842"/>
  <path class="link" d="M 882 194 L 914 194"/>
  <path class="link" d="M 1161 360 L 1161 390"/>
  <path class="link" d="M 1161 622 L 1161 652"/>
  <path class="link" d="M 1161 802 L 1161 842"/>
  <g><rect x="32" y="112" width="850" height="168" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="54" y="146" class="heading">准备与计划：先定义任务，再核对可用性</text>
    <text x="54" y="177" class="body">明确数学或软件契约、目标路径、读取范围与验收判据。</text>
    <text x="54" y="203" class="body">用户点名按 P0 锁定；role:* 补齐未指定维度。</text>
    <text x="54" y="229" class="body">plan 复查启停、路由、可读额度与冷却；日常不联网刷新性能。</text>
    <text x="54" y="255" class="body">轻重阈值读取 runtime_tunables.dispatch_confirmation。</text>
  </g>
  <g><rect x="32" y="310" width="850" height="130" rx="14" fill="#fff8e9" stroke="#d7b265"/>
    <text x="54" y="344" class="heading">完整确认：内部原生与外部无头通道一并列全</text>
    <text x="54" y="375" class="body">背景、要做什么、预计后果、14 列矩阵、性能更新时间和选项卡。</text>
    <text x="54" y="401" class="body">用户批准后运行 plan --approve-ticket；执行绑定 --ticket。</text>
    <text x="54" y="427" class="body">PreToolUse 检查有效票据，拦截裸调和未经确认的重负载。</text>
  </g>
  <g><rect x="32" y="470" width="850" height="152" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="54" y="504" class="heading">按批准计划执行：权限与验证边界不混用</text>
    <text x="54" y="535" class="body">batch 仅执行外部通道，原生代理由对应客户端调用。</text>
    <text x="54" y="561" class="body">只读小文件默认精确行号内联，前后快照核验零改动。</text>
    <text x="54" y="587" class="body">gate 锁定 --write-scope 并执行 --verify-cmd。</text>
    <text x="54" y="613" class="body">额度耗尽停止重试；同后端排队流停止，保留实际结果。</text>
  </g>
  <g><rect x="32" y="652" width="850" height="150" rx="14" fill="#eefaf4" stroke="#81bfa0"/>
    <text x="54" y="686" class="heading">完成与 Stop：按证据报清结果</text>
    <text x="54" y="717" class="body">reply_repeat_guard.py 按外部或原生通道规则检查成败词、Token 说明及回执或轨迹标识。</text>
    <text x="54" y="743" class="body">原生轨迹未提供 Token 整数时明确写无法统计。</text>
    <text x="54" y="769" class="body">主会话核对行号与适用条件，区分配置完成、离线检查和实际实测。</text>
  </g>
  <g><rect x="914" y="112" width="494" height="248" rx="14" fill="#f3efff" stroke="#b8a7dc"/>
    <text x="936" y="146" class="heading">压缩打断：独立加载专项确认单</text>
    <text x="936" y="177" class="body">session_context_loader.py 分块恢复：</text>
    <text x="936" y="203" class="body">常规用户原话与实质子代理摘要；</text>
    <text x="936" y="229" class="body">磁盘未决工作流与完整确认内容。</text>
    <text x="936" y="255" class="body">保留背景、目标、后果、矩阵和选项。</text>
    <text x="936" y="281" class="body">缺项报告缺口，不凭摘要补猜。</text>
    <text x="936" y="307" class="body">压缩与恢复不代表批准。</text>
  </g>
  <g><rect x="914" y="390" width="494" height="232" rx="14" fill="#f3efff" stroke="#b8a7dc"/>
    <text x="936" y="424" class="heading">交接打断：保留完整接力内容</text>
    <text x="936" y="455" class="body">drain 或 freeze 强制阶段由 Stop 检查。</text>
    <text x="936" y="481" class="body">【新对话提示词】嵌入完整工作流、</text>
    <text x="936" y="507" class="body">矩阵、性能更新时间、选项卡与票据。</text>
    <text x="936" y="533" class="body">Codex 与 Claude Code 默认 advisory。</text>
    <text x="936" y="559" class="body">强制行为以实际模式为准。</text>
  </g>
  <g><rect x="914" y="652" width="494" height="150" rx="14" fill="#f3efff" stroke="#b8a7dc"/>
    <text x="936" y="686" class="heading">新会话：复核后重新形成当前计划</text>
    <text x="936" y="717" class="body">plan --resume-ticket 读取旧票据。</text>
    <text x="936" y="743" class="body">不自动改绑 session_id，不推测批准。</text>
    <text x="936" y="769" class="body">跨会话重新生成确认票据再执行。</text>
  </g>
  <g><rect x="32" y="842" width="1376" height="220" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="54" y="876" class="heading">Codex 五类事件的执行链</text>
    <text x="54" y="907" class="body">SessionStart：compact 或 resume 入口恢复原话与未决工作流，再检查交接状态。</text>
    <text x="54" y="933" class="body">PostCompact：更新压缩后交接判断；UserPromptSubmit：按用户新指令更新判断。</text>
    <text x="54" y="959" class="body">PreToolUse：status_guard.py 检查写边界、重复日志读取、裸调与重负载票据，再检查交接。</text>
    <text x="54" y="985" class="body">Stop：reply_repeat_guard.py 检查重复回复与完工报账，handoff_gate.py 检查交接提示词。</text>
    <text x="54" y="1011" class="body">user_words.py 提供共享提取与状态能力；五事件与五脚本模块分别计数。</text>
    <text x="54" y="1037" class="body">check-grounding --strict 核对文档词法依据；不替代数学证明、运行验证和人工复核。</text>
  </g>
</svg>
