<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">会话生命周期防护管线与后台定量验证闭环</title>
  <desc id="flow-desc">上半部分展示交互式主会话按 runtime_tunables 动态调节的压缩实质恢复、写边界拦截与长会话交接管线；下半部分展示 cae-harness 独立子进程的动态角色选路、读写快照、定量验证与 check-grounding 事实锚定闭环。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 18px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 12px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .lane-hook { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .lane-ver { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .lane-hdr-g { font: 700 13.5px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #15803d; }
      .lane-hdr-b { font: 700 13.5px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .card-hdr { font: 700 12.5px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 11.2px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .mono { font: 600 10.8px Consolas, "SFMono-Regular", Menlo, monospace; fill: #0f172a; }
      .arrow-g { stroke: #16a34a; stroke-width: 1.7; fill: none; marker-end: url(#head-g); }
      .arrow-b { stroke: #2563eb; stroke-width: 1.7; fill: none; marker-end: url(#head-b); }
    </style>
    <marker id="head-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="head-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1064" height="484" rx="12" class="bg"/>
  <text x="540" y="35" text-anchor="middle" class="title">会话生命周期防护管线与后台定量验证闭环</text>
  <text x="540" y="55" text-anchor="middle" class="subtitle">未压缩回合零字节注入（保护前缀缓存） · 按客户端动态预算恢复原话与实质子代理结论 · 改码强制验证与零黑名单事实锚定</text>

  <!-- Upper Lane: Interactive Lifecycle Hooks -->
  <rect x="24" y="70" width="1032" height="192" rx="10" class="lane-hook"/>
  <text x="40" y="93" class="lane-hdr-g">A. 交互式主会话事件钩子管线（Antigravity / Codex / Claude Code 事件驱动 · 阈值读取 runtime_tunables）</text>

  <!-- Hook Step 1 -->
  <rect x="40" y="106" width="320" height="142" rx="7" class="card"/>
  <text x="52" y="126" class="card-hdr">① 恢复与调用前：动态双路恢复</text>
  <text x="52" y="143" class="mono">session_context_loader.py + user_words.py</text>
  <text x="52" y="162" class="body">• 无新压缩检查点：返回空对象（0 B 注入）</text>
  <text x="52" y="180" class="body">• 先还原截断全文，再按 per_client 恢复：</text>
  <text x="64" y="198" class="body">- 全部人类原话与问答选择（保首轮总纲）</text>
  <text x="64" y="216" class="body">- 保留最新及窗口内实质子代理摘要与指针</text>
  <text x="64" y="234" class="body">- 自动闭合截断代码围栏并与人类指令分区</text>

  <path d="M 360 177 L 380 177" class="arrow-g"/>

  <!-- Hook Step 2 -->
  <rect x="382" y="106" width="320" height="142" rx="7" class="card"/>
  <text x="394" y="126" class="card-hdr">② 工具执行前：写边界与防轮询门禁</text>
  <text x="394" y="143" class="mono">status_guard.py + handoff_gate.py</text>
  <text x="394" y="162" class="body">• 拦截未获批项目外写删、重定向、worktree、</text>
  <text x="406" y="180" class="body">编码子壳与 Python AST 越界写（无头直接 deny）</text>
  <text x="394" y="198" class="body">• 阻止对大小与修改时间未变的日志同区间重读</text>
  <text x="394" y="216" class="body">• 达 handoff_thresholds 进入 drain / freeze，</text>
  <text x="406" y="234" class="body">阻断新开子代理与 git push，预留预算收尾</text>

  <path d="M 702 177 L 722 177" class="arrow-g"/>

  <!-- Hook Step 3 -->
  <rect x="724" y="106" width="316" height="142" rx="7" class="card"/>
  <text x="736" y="126" class="card-hdr">③ 回合结束时：防空等与交接校验</text>
  <text x="736" y="143" class="mono">reply_repeat_guard.py + handoff_gate.py</text>
  <text x="736" y="162" class="body">• 连续达 consecutive_wait_limit 输出无新数值</text>
  <text x="748" y="180" class="body">进展的短句等待时单次拦截（保留迭代残差汇报）</text>
  <text x="736" y="198" class="body">• 冻结交接期核验已验证进展、Git 状态、待办项</text>
  <text x="748" y="216" class="body">及可复制的【新对话提示词】（含 GOAL_CANCELLED）</text>
  <text x="736" y="234" class="body">• 日志按上限滚动裁剪，低频清理空闲过期锁文件</text>

  <!-- Lower Lane: CAE Harness Closed-Loop Verification -->
  <rect x="24" y="278" width="1032" height="198" rx="10" class="lane-ver"/>
  <text x="40" y="301" class="lane-hdr-b">B. 后台独立子进程编排与事实锚定闭环（cae_harness.py：task / audit / gate / check-grounding）</text>

  <!-- Ver Step 1 -->
  <rect x="40" y="314" width="234" height="146" rx="7" class="card"/>
  <text x="52" y="334" class="card-hdr">1. 动态选路与预检</text>
  <text x="52" y="351" class="mono">probe / assess / role:*</text>
  <text x="52" y="370" class="body">• 识别通用课题或上游仓库模式</text>
  <text x="52" y="388" class="body">• 对称解析五个动态角色槽位候选</text>
  <text x="52" y="406" class="body">• 预检凭据、路由健康与配额冷却</text>
  <text x="52" y="424" class="body">• 按安全系数计算分片预算，跳过</text>
  <text x="64" y="442" class="body">ultra 自动委派挡与退役模型</text>

  <path d="M 274 387 L 292 387" class="arrow-b"/>

  <!-- Ver Step 2 -->
  <rect x="294" y="314" width="234" height="146" rx="7" class="card"/>
  <text x="306" y="334" class="card-hdr">2. 独立上下文与读写边界</text>
  <text x="306" y="351" class="mono">CAE_HARNESS_DEPTH=1</text>
  <text x="306" y="370" class="body">• 全新进程运行，不挤占主会话窗口</text>
  <text x="306" y="388" class="body">• 只读任务：前后全树文件哈希快照</text>
  <text x="306" y="406" class="body">• 盲读模式：--clean-room 剥离规则</text>
  <text x="306" y="424" class="body">• 改码任务：--write-scope 锁定白</text>
  <text x="318" y="442" class="body">名单，越界立即报 scope_violation</text>

  <path d="M 528 387 L 546 387" class="arrow-b"/>

  <!-- Ver Step 3 -->
  <rect x="548" y="314" width="234" height="146" rx="7" class="card"/>
  <text x="560" y="334" class="card-hdr">3. 定量门禁闭环修正</text>
  <text x="560" y="351" class="mono">gate --verify-cmd</text>
  <text x="560" y="370" class="body">• 强制绑定非空定量验证脚本</text>
  <text x="560" y="388" class="body">• 严禁放宽 rtol / atol 或删断言</text>
  <text x="560" y="406" class="body">• 未通过时自动将真实报错回传子进</text>
  <text x="572" y="424" class="body">程在 --max-rounds 内迭代修复</text>
  <text x="560" y="442" class="body">• 回执实报 verification_executed</text>

  <path d="M 782 387 L 800 387" class="arrow-b"/>

  <!-- Ver Step 4 -->
  <rect x="802" y="314" width="238" height="146" rx="7" class="card"/>
  <text x="814" y="334" class="card-hdr">4. 事实锚定与 R6 终审</text>
  <text x="814" y="351" class="mono">check-grounding / L1–L4</text>
  <text x="814" y="370" class="body">• 零黑名单拦截陌生缩写与虚构术语</text>
  <text x="814" y="388" class="body">• 主会话亲自打开原文件核对行号</text>
  <text x="814" y="406" class="body">• L1 源码就位 · L2 编译单测通过</text>
  <text x="814" y="424" class="body">• L3 离散守恒与不变量达机器零</text>
  <text x="814" y="442" class="body">• L4 网格加密收敛阶 EOC 达标</text>
</svg>
