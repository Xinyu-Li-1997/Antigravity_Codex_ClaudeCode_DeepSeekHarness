<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1158" viewBox="0 0 1440 1158" role="img" aria-labelledby="title desc">
  <title id="title">四客户端配置与全通道派工架构</title>
  <desc id="desc">稳定执行机制与动态配置分开维护；长期启停决策与日常可用性复查分开执行。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
  <style>text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23354d; } .title { font-size: 28px; font-weight: 700; } .subtitle { font-size: 17px; fill: #52657b; } .heading { font-size: 21px; font-weight: 700; } .body { font-size: 16px; } .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }</style>
  <rect width="1440" height="1158" fill="#f3f6fb"/>
  <text x="32" y="49" class="title">四客户端配置与全通道派工架构</text>
  <text x="32" y="80" class="subtitle">稳定执行机制与动态配置分开维护；长期启停决策与日常可用性复查分开执行。</text>
  <path class="link" d="M 367 274 L 367 304"/>
  <path class="link" d="M 1073 274 L 1073 304"/>
  <path class="link" d="M 720 430 L 720 460"/>
  <path class="link" d="M 720 610 L 720 640"/>
  <path class="link" d="M 367 806 L 367 836"/>
  <path class="link" d="M 1073 806 L 1073 836"/>
  <path class="link" d="M 367 968 L 367 998"/>
  <path class="link" d="M 1073 968 L 1073 998"/>
  <g><rect x="32" y="112" width="670" height="162" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="54" y="146" class="heading">常驻机制：规则、钩子与验证入口</text>
    <text x="54" y="177" class="body">全局规则与 readonly-* 代理约束工程边界。</text>
    <text x="54" y="203" class="body">install.py 分发模板；cae_harness.py 组织后台验证。</text>
    <text x="54" y="229" class="body">交互主会话保留用户选择的模型与推理强度。</text>
  </g>
  <g><rect x="738" y="112" width="670" height="162" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="760" y="146" class="heading">动态来源：fleet_profile.json</text>
    <text x="760" y="177" class="body">五角色：orchestrator、math、code、review、fast。</text>
    <text x="760" y="203" class="body">runtime_tunables 集中维护运行参数。</text>
    <text x="760" y="229" class="body">subscription_matrix 与 capability_ledger 分别记录启停和性能。</text>
  </g>
  <g><rect x="32" y="304" width="1376" height="126" rx="14" fill="#f3efff" stroke="#b8a7dc"/>
    <text x="54" y="338" class="heading">第一道门：独立维护与用户拍板</text>
    <text x="54" y="369" class="body">fleet-evolve 联网评估能力，展示本机可用性与额度类型；用户决定 agent 和 LLM 启停。</text>
    <text x="54" y="395" class="body">subscription_matrix 中 enabled: false 的项全局跳过；日常派工不联网更新性能。</text>
  </g>
  <g><rect x="32" y="460" width="1376" height="150" rx="14" fill="#eefaf4" stroke="#81bfa0"/>
    <text x="54" y="494" class="heading">第二道门：plan 弹卡前离线复查</text>
    <text x="54" y="525" class="body">核对程序、凭据配置、所需路由存活和当前运行侧冷却。</text>
    <text x="54" y="551" class="body">读取本机可得的滚动窗口百分比与重置时间、卡片套餐或余额类型、日月限额。</text>
    <text x="54" y="577" class="body">过滤不可用或超限通道；未知信息保持未知，不推断服务端实时余额。</text>
  </g>
  <g><rect x="32" y="640" width="1376" height="166" rx="14" fill="#fff8e9" stroke="#d7b265"/>
    <text x="54" y="674" class="heading">全通道重负载确认：用户点名 P0 与角色入口并列</text>
    <text x="54" y="705" class="body">plan 生成人话背景、目标、预计后果与 14 列完整矩阵，列全模型、权限、额度和回执位置。</text>
    <text x="54" y="731" class="body">显示 last_online_refresh_at 与 local_bench_verified_at；选项为批准、微调后批准、暂缓并交接。</text>
    <text x="54" y="757" class="body">批准后以 --approve-ticket 登记；PreToolUse 检查票据并拦截裸 CLI 旁路。</text>
    <text x="54" y="783" class="body">点名锁定已指定维度；窗口、非委派挡位、无头标志、行号内联与快照按实际通道补齐。</text>
  </g>
  <g><rect x="32" y="836" width="670" height="132" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="54" y="870" class="heading">外部通道：cae-harness 无头子进程</text>
    <text x="54" y="901" class="body">batch 仅执行 cae_harness_headless，按后端限制并发。</text>
    <text x="54" y="927" class="body">只读快照与行号内联；可写绑定范围及验收命令。</text>
    <text x="54" y="953" class="body">DSH 按命令能力适配权限参数与补丁。</text>
  </g>
  <g><rect x="738" y="836" width="670" height="132" rx="14" fill="#ffffff" stroke="#b5c8e5"/>
    <text x="760" y="870" class="heading">内部通道：客户端原生子代理与工作流</text>
    <text x="760" y="901" class="body">native_subagent、native_workflow、native_swarm。</text>
    <text x="760" y="927" class="body">inherit 显示解析结果；多路或可写委派纳入确认。</text>
    <text x="760" y="953" class="body">由对应客户端执行，不交给 batch，不声明净室隔离。</text>
  </g>
  <g><rect x="32" y="998" width="1376" height="132" rx="14" fill="#eefaf4" stroke="#81bfa0"/>
    <text x="54" y="1032" class="heading">事件恢复、交接与完成核验</text>
    <text x="54" y="1063" class="body">Codex 五事件：SessionStart、PostCompact、UserPromptSubmit、PreToolUse、Stop。</text>
    <text x="54" y="1089" class="body">压缩后常规摘要与未决专项计划分开恢复；强制交接 Stop 检查【新对话提示词】和选项卡。</text>
    <text x="54" y="1115" class="body">完工 Stop 按外部与原生规则检查成败词、Token 说明及回执或轨迹标识；主会话逐路核对状态与汇总。</text>
  </g>
</svg>
