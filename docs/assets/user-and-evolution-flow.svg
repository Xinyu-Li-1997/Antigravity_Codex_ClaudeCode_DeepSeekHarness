<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">日常课题协作与配置仓库维护流程</title>
  <desc id="desc">左侧为日常课题目录中的指定模型与角色选路流程，右侧为本配置仓库的维护与更新流程，中间按工作区模式隔离。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #475569; }
    .lane { font-size: 22px; font-weight: 700; }
    .lane-sub { font-size: 15px; fill: #475569; }
    .heading { font-size: 19px; font-weight: 700; }
    .body { font-size: 15px; fill: #334155; }
    .badge { font-size: 13px; font-weight: 700; fill: #334155; }
    .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1440" height="880" rx="18" fill="#f4f7fb"/>
  <text x="36" y="48" class="title">日常课题协作与配置仓库维护流程</text>
  <text x="36" y="78" class="subtitle">运行 install.py 同步至用户级配置目录后，系统按工作区自动区分日常课题研发与配置仓库维护。</text>

  <!-- Left Lane Container: everyday project -->
  <rect x="28" y="102" width="668" height="748" rx="16" fill="#eaf2ff" stroke="#adc6eb" stroke-width="1.5"/>
  <text x="52" y="138" class="lane">日常课题与工程目录（通用研发模式）</text>
  <text x="52" y="163" class="lane-sub">任意 C++、Fortran、Rust、Python 课题目录直接使用，不向项目目录复制配置文件</text>

  <g>
    <rect x="50" y="184" width="624" height="96" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="72" y="216" class="heading">1. 同端归原生、跨端与铁面验收归本仓</text>
    <text x="72" y="244" class="body">同端规划、/teamwork、/swarm、/goal、/compact、spawn_agent 与 Agent 直走原生。</text>
    <text x="72" y="268" class="body">Antigravity、Codex、Claude Code 与 DSH 四端对等，按端裁剪规则与单入口钩子。</text>
  </g>

  <path class="link" d="M 200 280 L 200 310"/>
  <path class="link" d="M 520 280 L 520 310"/>

  <g>
    <rect x="50" y="310" width="302" height="168" rx="12" fill="#fff8e8" stroke="#dbb464"/>
    <text x="68" y="342" class="heading">2A. 显式指定（最高优先级）</text>
    <text x="68" y="370" class="body">指定客户端、具体模型或挡位。</text>
    <text x="68" y="396" class="body">无头调用自动补全声明窗口、</text>
    <text x="68" y="422" class="body">只读行号内联、快照与脱敏。</text>
    <text x="68" y="448" class="body">目标不可用直接报错，不静默降级。</text>
  </g>

  <g>
    <rect x="372" y="310" width="302" height="168" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="390" y="342" class="heading">2B. 按任务目标自动选路</text>
    <text x="390" y="370" class="body">仅说明推导、实现或审查目标。</text>
    <text x="390" y="396" class="body">按统筹、数理、编码、审查与快检</text>
    <text x="390" y="422" class="body">五类动态角色从可用端自动分配。</text>
    <text x="390" y="448" class="body">本机私有覆盖放 fleet_profile.local.json。</text>
  </g>

  <path class="link" d="M 200 478 L 200 508"/>
  <path class="link" d="M 520 478 L 520 508"/>

  <g>
    <rect x="50" y="508" width="624" height="142" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="72" y="540" class="heading">3. 读前分片、外部持票与压缩恢复</text>
    <text x="72" y="568" class="body">大仓库先经 read-plan 评估体积并切分保守波次，避免上下文溢出。</text>
    <text x="72" y="594" class="body">外部重负载落盘明细文件并展三句话摘要获批；同端原生模式无冗余索票。</text>
    <text x="72" y="620" class="body">长对话压缩后自动恢复原话、双窗口回复索引与未决总览，手动 /compact 零误杀。</text>
  </g>

  <path class="link" d="M 362 650 L 362 680"/>

  <g>
    <rect x="50" y="680" width="624" height="146" rx="12" fill="#eefaf4" stroke="#82bfa0"/>
    <text x="72" y="712" class="heading">4. 定量验收、机械对账与按需专项技能</text>
    <text x="72" y="740" class="body">只读任务比对文件快照；可写 gate 锁白名单并跑通验收命令，R4 写边界全程硬守。</text>
    <text x="72" y="766" class="body">外部完工产出 reconcile 对账表；多端审查经 cross-check 查盲区与分歧。</text>
    <text x="72" y="792" class="body">文档走 check-grounding --doc-hygiene；按需点名启用 cae-writing 与 cae-axioms。</text>
  </g>

  <!-- Center Workspace Mode Isolation Divider -->
  <line x1="720" y1="108" x2="720" y2="846" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7"/>
  <rect x="699" y="428" width="42" height="118" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="720" y="456" text-anchor="middle" class="badge">模</text>
  <text x="720" y="478" text-anchor="middle" class="badge">式</text>
  <text x="720" y="500" text-anchor="middle" class="badge">隔</text>
  <text x="720" y="522" text-anchor="middle" class="badge">离</text>

  <!-- Right Lane Container: upstream config repo -->
  <rect x="744" y="102" width="668" height="748" rx="16" fill="#f4effc" stroke="#bdaae0" stroke-width="1.5"/>
  <text x="768" y="138" class="lane">本配置仓库维护与元更新（上游维护模式）</text>
  <text x="768" y="163" class="lane-sub">fleet-evolve 仅留本仓库不下发宿主；严守公理边界（只读探测 + 提案，禁自改主体代码）</text>

  <g>
    <rect x="766" y="184" width="624" height="122" rx="12" fill="#ffffff" stroke="#c5b6e3"/>
    <text x="788" y="216" class="heading">1. 按维护需求选择三种模式（fleet-evolve）</text>
    <text x="788" y="244" class="body">全面更新（full）：盘点四端能力矩阵、双端环境、代理档案与五类角色。</text>
    <text x="788" y="270" class="body">机制与文档整理（hygiene）：选型不变，将问题下沉为单测守卫并分层整理文档。</text>
    <text x="788" y="294" class="body">只读巡检（audit）：零修改输出双轨诊断即结束，不进入后续变更流程。</text>
  </g>

  <path class="link" d="M 1078 306 L 1078 336"/>
  <text x="1092" y="326" class="badge">full / hygiene 变更路径</text>

  <g>
    <rect x="766" y="336" width="624" height="142" rx="12" fill="#ffffff" stroke="#c5b6e3"/>
    <text x="788" y="368" class="heading">2. 四端四值能力探针与双轨信号（audit-upgrade）</text>
    <text x="788" y="396" class="body">只读探测四端 CLI 能力矩阵、插件清单校验与模式指南覆盖度（四值证据口径）。</text>
    <text x="788" y="422" class="body">运维阻断进 recommended_actions，协议演进进 evolution_signals，互不污染日常对齐。</text>
    <text x="788" y="448" class="body">core_sha256 全覆锁定钩子、规则与模板；在线刷新时间落盘，日常派工仅离线复查。</text>
  </g>

  <path class="link" d="M 1078 478 L 1078 508"/>

  <g>
    <rect x="766" y="508" width="624" height="142" rx="12" fill="#fff8e8" stroke="#dbb464"/>
    <text x="788" y="540" class="heading">3. 四类人工确认节点（涉及变更时触发）</text>
    <text x="788" y="568" class="body">① 审定客户端与模型推荐矩阵、运行阈值及订阅启停开关；</text>
    <text x="788" y="594" class="body">② 写入本机全局配置目录（先 --dry-run 预览）或切换主会话客户端；</text>
    <text x="788" y="620" class="body">③ Python、CUDA、WSL 等编译型科学计算包 ABI 升级；④ git push。</text>
  </g>

  <path class="link" d="M 1078 650 L 1078 680"/>

  <g>
    <rect x="766" y="680" width="624" height="146" rx="12" fill="#eefaf4" stroke="#82bfa0"/>
    <text x="788" y="712" class="heading">4. 按需双端同步、重启核验与全仓验收</text>
    <text x="788" y="740" class="body">获批后同步本机；同时使用 Windows 与 WSL2 时须两侧分别同步并核验零漂移。</text>
    <text x="788" y="766" class="body">涉及主会话客户端更新时，经重启前后两步状态锁核验归位。</text>
    <text x="788" y="792" class="body">最终通过全量回归、公开脱敏与 check-grounding --strict --doc-hygiene。</text>
  </g>
</svg>
