<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">日常课题协作与配置仓库维护流程</title>
  <desc id="desc">左侧为日常课题目录中的指定模型与角色选路流程，右侧为本配置仓库的维护与更新流程，中间按工作区模式隔离。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #475569; }
    .lane { font-size: 22px; font-weight: 700; }
    .lane-sub { font-size: 15px; fill: #475569; }
    .heading { font-size: 19px; font-weight: 700; }
    .body { font-size: 15px; fill: #334155; }
    .badge { font-size: 13px; font-weight: 700; fill: #334155; }
    .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1440" height="880" rx="18" fill="#f4f7fb"/>
  <text x="36" y="48" class="title">日常课题协作与配置仓库维护流程</text>
  <text x="36" y="78" class="subtitle">一次运行 install.py 同步至本机客户端配置目录后，系统按工作区模式自动区分日常课题开发与配置仓库维护。</text>

  <!-- Left Lane Container: general_project -->
  <rect x="28" y="102" width="668" height="748" rx="16" fill="#eaf2ff" stroke="#adc6eb" stroke-width="1.5"/>
  <text x="52" y="138" class="lane">日常业务课题目录（general_project）</text>
  <text x="52" y="163" class="lane-sub">任意 C++、Fortran、Rust、Python 课题目录直接使用，无需复制配置文件</text>

  <g>
    <rect x="50" y="184" width="624" height="96" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="72" y="216" class="heading">1. 自然中文输入（主会话联动 cae_harness.py）</text>
    <text x="72" y="244" class="body">主会话保留你自己选定的客户端、模型与推理强度；单端可独立工作。</text>
    <text x="72" y="268" class="body">Antigravity、Codex、Claude Code、DSH 四端处于同一对等层级。</text>
  </g>

  <path class="link" d="M 200 280 L 200 310"/>
  <path class="link" d="M 520 280 L 520 310"/>

  <g>
    <rect x="50" y="310" width="302" height="168" rx="12" fill="#fff8e8" stroke="#dbb464"/>
    <text x="68" y="342" class="heading">2A. 明确点名（P0 优先）</text>
    <text x="68" y="370" class="body">指定客户端、具体模型或挡位。</text>
    <text x="68" y="396" class="body">无头调用自动补全声明最大窗口、</text>
    <text x="68" y="422" class="body">非委派挡位、行号内联与快照。</text>
    <text x="68" y="448" class="body">不可用直接报错，绝不静默降级。</text>
  </g>

  <g>
    <rect x="372" y="310" width="302" height="168" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="390" y="342" class="heading">2B. 模糊交办（角色选路）</text>
    <text x="390" y="370" class="body">只交代推导、编码或独立审查目标。</text>
    <text x="390" y="396" class="body">按 orchestrator、math、code、</text>
    <text x="390" y="422" class="body">review、fast 五角色动态选路。</text>
    <text x="390" y="448" class="body">关键审查优先跨客户端独立执行。</text>
  </g>

  <path class="link" d="M 200 478 L 200 508"/>
  <path class="link" d="M 520 478 L 520 508"/>

  <g>
    <rect x="50" y="508" width="624" height="142" rx="12" fill="#ffffff" stroke="#b8cde8"/>
    <text x="72" y="540" class="heading">3. 轻任务静默执行 · 重负载先生成纵向 14 项确认单</text>
    <text x="72" y="568" class="body">小范围单路检查静默执行；内部原生与外部无头重负载统一先运行 plan。</text>
    <text x="72" y="594" class="body">输出 compact_summary_card，完整 14 项参数写入 &lt;ticket_id&gt;_card.md。</text>
    <text x="72" y="620" class="body">压缩时按窗口缩放预算并折叠历史确认单明细；获批后凭 --ticket 放行。</text>
  </g>

  <path class="link" d="M 362 650 L 362 680"/>

  <g>
    <rect x="50" y="680" width="624" height="146" rx="12" fill="#eefaf4" stroke="#82bfa0"/>
    <text x="72" y="712" class="heading">4. 定量验证、完成回执检查与主会话原文终审</text>
    <text x="72" y="740" class="body">只读任务比对哈希快照；可写 gate 锁范围并强制跑通 --verify-cmd。</text>
    <text x="72" y="766" class="body">严禁放宽容差与守恒判据；文档润色配合 --clean-room 与事实锚定。</text>
    <text x="72" y="792" class="body">Stop 检查成败词、Token 说明与回执标识；主会话亲自核对行号与算术。</text>
  </g>

  <!-- Center Workspace Mode Isolation Divider -->
  <line x1="720" y1="108" x2="720" y2="846" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7"/>
  <rect x="699" y="428" width="42" height="118" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="720" y="456" text-anchor="middle" class="badge">模</text>
  <text x="720" y="478" text-anchor="middle" class="badge">式</text>
  <text x="720" y="500" text-anchor="middle" class="badge">隔</text>
  <text x="720" y="522" text-anchor="middle" class="badge">离</text>

  <!-- Right Lane Container: upstream_config_repo -->
  <rect x="744" y="102" width="668" height="748" rx="16" fill="#f4effc" stroke="#bdaae0" stroke-width="1.5"/>
  <text x="768" y="138" class="lane">本配置仓库维护与更新（upstream_config_repo）</text>
  <text x="768" y="163" class="lane-sub">模型换代或订阅变化时直接在本仓库维护更新；普通课题误调返回退出码 2</text>

  <g>
    <rect x="766" y="184" width="624" height="122" rx="12" fill="#ffffff" stroke="#c5b6e3"/>
    <text x="788" y="216" class="heading">1. 按维护需求选择 fleet-evolve 三种模式</text>
    <text x="788" y="244" class="body">全面更新（full）：核查客户端与模型换代，重算五角色与运行参数。</text>
    <text x="788" y="270" class="body">代码与文档整理（hygiene）：选型不变，修复代码问题并同步文档。</text>
    <text x="788" y="294" class="body">只读检查（audit）：只读检查配置漂移与 ABI 风险，全程零写入。</text>
  </g>

  <path class="link" d="M 1078 306 L 1078 336"/>

  <g>
    <rect x="766" y="336" width="624" height="142" rx="12" fill="#ffffff" stroke="#c5b6e3"/>
    <text x="788" y="368" class="heading">2. 联网能力核查与本机可用性探测（full 模式）</text>
    <text x="788" y="396" class="body">结合官方资料、本机报错与实测证据，同时标明模型优势与已知短板。</text>
    <text x="788" y="422" class="body">同步展示本机各端与模型是否就绪、配置的额度类型及退订候选。</text>
    <text x="788" y="448" class="body">在 capability_ledger 记录评估日期，日常派工无需联网查榜单。</text>
  </g>

  <path class="link" d="M 1078 478 L 1078 508"/>

  <g>
    <rect x="766" y="508" width="624" height="142" rx="12" fill="#fff8e8" stroke="#dbb464"/>
    <text x="788" y="540" class="heading">3. 四项人工确认要求（full / hygiene 涉及变更时）</text>
    <text x="788" y="568" class="body">① 审定推荐配置、运行参数与 subscription_matrix 启停；</text>
    <text x="788" y="594" class="body">② 写入本机全局配置目录（先 --dry-run 预览）或切换主客户端；</text>
    <text x="788" y="620" class="body">③ Python、CUDA、WSL 等编译型科学计算包 ABI 升级；④ git push。</text>
  </g>

  <path class="link" d="M 1078 650 L 1078 680"/>

  <g>
    <rect x="766" y="680" width="624" height="146" rx="12" fill="#eefaf4" stroke="#82bfa0"/>
    <text x="788" y="712" class="heading">4. 确认同步、主客户端重启核验与文档一致性校验</text>
    <text x="788" y="740" class="body">确认后由 install.py 同步本机目录并核验 all_aligned。</text>
    <text x="788" y="766" class="body">涉及主客户端更新时经 record-pass1 与 verify-pass2 重启核验。</text>
    <text x="788" y="792" class="body">最终运行 clear --verified --readback-done 通过事实锚定后归位。</text>
  </g>
</svg>
